<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#1b0b17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#E82C7C" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E82C7C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff7eb3"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Fira Code', 'Consolas', 'Courier New', monospace; }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
  </defs>

  <rect width="1200" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="22" fill="url(#dots)"/>
  <rect width="1200" height="380" rx="22" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="378" rx="21" fill="none" stroke="#E82C7C" stroke-opacity="0.35" stroke-width="2"/>

  <!-- greeting pill -->
  <rect x="60" y="52" width="210" height="34" rx="17" fill="#E82C7C" fill-opacity="0.12" stroke="#E82C7C" stroke-opacity="0.5"/>
  <circle cx="82" cy="69" r="5" fill="#E82C7C"/>
  <text x="98" y="74" class="mono" font-size="13" fill="#f3c4d8" letter-spacing="1">// hello, world</text>

  <!-- name -->
  <text x="60" y="165" font-size="66" font-weight="800" fill="url(#name)">Diluminda Peiris</text>

  <!-- roles -->
  <text x="62" y="212" font-size="25" font-weight="600" fill="#E82C7C">Full-Stack Developer <tspan fill="#6b7280">/</tspan> DevOps &amp; Mobile Engineer</text>
  <text x="62" y="248" font-size="17" fill="#9ca3af" font-style="italic">Co-Founder @ Creative Dep · Crafting digital experiences, one commit at a time.</text>

  <!-- chips -->
  <g class="mono" font-size="13" fill="#e5e7eb" letter-spacing="0.5">
    <rect x="60" y="288" width="152" height="36" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#E82C7C" stroke-opacity="0.4"/>
    <text x="78" y="311">FULL-STACK DEV</text>
    <rect x="226" y="288" width="86" height="36" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#E82C7C" stroke-opacity="0.4"/>
    <text x="244" y="311">DEVOPS</text>
    <rect x="326" y="288" width="161" height="36" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#E82C7C" stroke-opacity="0.4"/>
    <text x="344" y="311">MOBILE ENGINEER</text>
    <rect x="501" y="288" width="119" height="36" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#E82C7C" stroke-opacity="0.4"/>
    <text x="519" y="311">CO-FOUNDER</text>
  </g>

  <!-- code card -->
  <g class="float">
    <rect x="780" y="58" width="360" height="262" rx="16" fill="#0a0d12" stroke="#E82C7C" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="780" y="58" width="360" height="40" rx="16" fill="#E82C7C" fill-opacity="0.10"/>
    <circle cx="804" cy="78" r="6" fill="#ff5f56"/>
    <circle cx="824" cy="78" r="6" fill="#ffbd2e"/>
    <circle cx="844" cy="78" r="6" fill="#27c93f"/>
    <text x="1060" y="83" class="mono" font-size="12" fill="#6b7280">dilu.js</text>
    <g class="mono" font-size="15">
      <text x="802" y="130"><tspan fill="#E82C7C">const</tspan> <tspan fill="#e5e7eb">dilu</tspan> <tspan fill="#6b7280">=</tspan> <tspan fill="#e5e7eb">{</tspan></text>
      <text x="826" y="160"><tspan fill="#ff9ec7">role</tspan><tspan fill="#6b7280">:</tspan> <tspan fill="#a5d6a7">"Full-Stack Dev"</tspan><tspan fill="#6b7280">,</tspan></text>
      <text x="826" y="190"><tspan fill="#ff9ec7">stack</tspan><tspan fill="#6b7280">:</tspan> <tspan fill="#a5d6a7">["MERN","Flutter"]</tspan><tspan fill="#6b7280">,</tspan></text>
      <text x="826" y="220"><tspan fill="#ff9ec7">loves</tspan><tspan fill="#6b7280">:</tspan> <tspan fill="#a5d6a7">["DevOps","Mobile"]</tspan><tspan fill="#6b7280">,</tspan></text>
      <text x="826" y="250"><tspan fill="#ff9ec7">coffee</tspan><tspan fill="#6b7280">:</tspan> <tspan fill="#79c0ff">true</tspan><tspan fill="#6b7280">,</tspan></text>
      <text x="802" y="280"><tspan fill="#e5e7eb">}</tspan><tspan fill="#6b7280">;</tspan></text>
      <rect class="blink" x="822" y="290" width="9" height="18" fill="#E82C7C"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
